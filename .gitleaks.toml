# Gitleaks configuration — extends the default ruleset.
# The historical Unsplash key committed in ddc99343 has been removed from the
# current code (moved to import.meta.env) but remains in git history. It is
# acknowledged in .gitleaksignore rather than allowlisted here, so a real key
# committed anywhere else still trips the scanner. See IMPROVEMENT_PLAN.md
# (security note): the key itself should still be rotated on the Unsplash side.

[extend]
useDefault = true

[[allowlists]]
description = "Model-variant <option> values are UI strings, not secrets"
regexTarget = "line"
regexes = ['''<option value="sapiens2(-fp16|-int8|-fp32)?">''']

[[allowlists]]
description = """
Fixtures in the openaiCompat tests. These are invented strings asserted
against, not credentials — several tests exist precisely to prove that
key-shaped input gets redacted, so they cannot avoid containing key-shaped
literals. Scoped to this one path so a real key committed anywhere else still
trips the scanner.
"""
paths = ['''^src/openaiCompat\.test\.ts$''']
