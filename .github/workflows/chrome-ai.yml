name: E2E (Chrome AI / Gemini Nano)

# On demand: Actions → this workflow → Run workflow. It also runs on PRs that
# change the Chrome AI test itself. The hosted Linux runner (4 vCPU, 16 GB
# RAM) downloads and runs Gemini Nano in about 90 s.
on:
  workflow_dispatch:
  pull_request:
    paths: [e2e/chrome-ai.spec.ts, .github/workflows/chrome-ai.yml]

permissions:
  contents: read

jobs:
  chrome-ai:
    name: e2e (chrome-ai)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npx playwright test --project=chrome-ai
