name: Gemini Nano runner probe
# Throwaway: does Chrome's on-device Gemini Nano run on GitHub-hosted Linux/Windows runners?
on:
  push:
    branches: [claude/serene-shannon-0wz4bw]
    paths: [scripts/nano-probe/**, .github/workflows/nano-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        name: Free disk (Gemini Nano wants ~22 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p" && cp scripts/nano-probe/probe.mjs "$RUNNER_TEMP/p/"
          cd "$RUNNER_TEMP/p" && npm init -y >/dev/null && npm i playwright-core@1.56.1
      - if: runner.os == 'Linux'
        run: xvfb-run -a node "$RUNNER_TEMP/p/probe.mjs"
      - if: runner.os == 'Windows'
        shell: bash
        run: node "$RUNNER_TEMP/p/probe.mjs"
