name: E2E (WebGPU)

# EmbeddingGemma 2 end to end on a real GPU: GitHub's macOS arm64 runners give
# Chrome the Apple GPU through WebGPU (Linux/Windows runners only get SwiftShader).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.profile }})
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, desktop]
    # Only the phone profile is required; desktop is informational.
    continue-on-error: ${{ matrix.profile == 'desktop' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.profile }}

  # One real-Safari run (Safari 26 ships WebGPU); Chrome carries the rest.
  safari:
    name: e2e (safari)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - name: Serve the app
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > vite.log 2>&1 &
          npx -y wait-on@8 -t 60000 http://127.0.0.1:5173
      - run: node --test --test-reporter=spec e2e/safari/embeddinggemma2.test.mjs
      - if: failure()
        run: cat vite.log
