name: CI/CD - Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # Type-check and the CPU tests need nothing from each other, so they run side by side;
  # the deploy (which builds) starts when both are green.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test

  deploy:
    name: validate-and-deploy # the check's old name, in case branch protection requires it
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the preview-URL comment
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Not `npm run build`: that type-checks too, which the typecheck job did.
      - run: npx vite build

      - name: Deploy to Cloudflare Pages
        id: deploy
        continue-on-error: true
        run: |
          OUTPUT=$(npx wrangler pages deploy dist --project-name media-clusterer --branch "$DEPLOY_BRANCH" 2>&1)
          echo "$OUTPUT"
          LAST_TWO=$(echo "$OUTPUT" | tail -2)
          {
            echo "summary<<EOF"
            echo "$LAST_TWO"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de11927c1b728c9897c960abbe336098
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY: ${{ steps.deploy.outputs.summary }}
        run: gh pr comment "$PR_NUMBER" --body "$SUMMARY"
