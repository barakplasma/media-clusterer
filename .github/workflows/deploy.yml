name: CI/CD - Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Type-check, the CPU tests and the build need nothing from each other, so they run side by side;
  # the deploy waits for all three.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      # Not `npm run build`: that type-checks too, which the typecheck job does.
      - run: npx vite build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: validate-and-deploy # the check's old name, in case branch protection requires it
    needs: [typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci # for wrangler
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        continue-on-error: true
        run: |
          OUTPUT=$(npx wrangler pages deploy dist --project-name media-clusterer --branch "$DEPLOY_BRANCH" 2>&1)
          echo "$OUTPUT"
          LAST_TWO=$(echo "$OUTPUT" | tail -2)
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LAST_TWO" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: de11927c1b728c9897c960abbe336098
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Comment on PR with deployment URL
        if: github.event_name == 'pull_request' && steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body "${{ steps.deploy.outputs.summary }}"
