name: Android device test (Firebase Test Lab)

# On demand only (Actions → this workflow → Run workflow): every run spends
# physical Test Lab minutes. Opens device-test.html from this branch's
# Cloudflare preview in Chrome on a real phone and waits for "DONE pass".
#
# One-time setup (Workload Identity Federation, no key file):
#   1. gcloud iam workload-identity-pools create github --location=global
#      gcloud iam workload-identity-pools providers create-oidc github \
#        --location=global --workload-identity-pool=github \
#        --issuer-uri=https://token.actions.githubusercontent.com \
#        --attribute-mapping=google.subject=assertion.sub,attribute.repository=assertion.repository \
#        --attribute-condition="assertion.repository=='barakplasma/media-clusterer'"
#   2. Let the pool impersonate a service account that has roles/cloudtestservice.testAdmin,
#      roles/firebase.analyticsViewer and write access to the results bucket:
#      gcloud iam service-accounts add-iam-policy-binding SA_EMAIL \
#        --role=roles/iam.workloadIdentityUser \
#        --member="principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/attribute.repository/barakplasma/media-clusterer"
#   3. Repo → Settings → Secrets and variables → Actions → Variables:
#      GCP_WIF_PROVIDER = projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github
#      GCP_SA_EMAIL     = the service account above
#      GCP_PROJECT_ID   = the Firebase project id
#      GCP_RESULTS_BUCKET = a bucket the service account can write
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testlab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Google Cloud configuration
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA_EMAIL: ${{ vars.GCP_SA_EMAIL }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_RESULTS_BUCKET: ${{ vars.GCP_RESULTS_BUCKET }}
        run: |
          missing=""
          for v in GCP_WIF_PROVIDER GCP_SA_EMAIL GCP_PROJECT_ID GCP_RESULTS_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Test Lab not configured::Missing repository variable(s):$missing. Set them under Settings → Secrets and variables → Actions → Variables; the steps are at the top of .github/workflows/testlab.yml. No key file is needed: this workflow signs in with Workload Identity Federation."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

        with:

          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.14'
      - name: Build the harness
        working-directory: android-device-test
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Sideload Chromium
        run: |
          # Stock Chrome on older Test Lab images (Pixel 7a: Chrome 103) has no WebGPU.
          REV=1725074 # Chromium 158.0.8119.0, the build the Pixel 7a passed with
          curl -sSfL -o chrome-android.zip "https://commondatastorage.googleapis.com/chromium-browser-snapshots/Android_Arm64/$REV/chrome-android.zip"
          unzip -q -j chrome-android.zip chrome-android/apks/ChromePublic.apk

      - name: Run on Test Lab
        env:
          # Pixel 7a only: Pixel 10's PowerVR driver is on Chrome's WebGPU
          # blocklist ("PowerVR*25.1*"), so real Pixel 10s get no adapter either.
          DEVICE: lynx:33
          BRANCH: ${{ github.ref_name }}
          BUCKET: ${{ vars.GCP_RESULTS_BUCKET }}
        run: |
          if [ "$BRANCH" = main ]; then host=media-clusterer.pages.dev
          else
            # Cloudflare Pages branch alias: lowercase, non-alphanumerics to '-', 28 chars.
            slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
            host="$slug.media-clusterer.pages.dev"
          fi
          URL="https://$host/device-test.html"
          model=${DEVICE%%:*}; version=${DEVICE#*:}
          # Stock Chrome on the Pixel 7a image is 103 (no WebGPU), so use the sideloaded Chromium.
          pkg=org.chromium.chrome; extra=(--additional-apks ChromePublic.apk)
          dir="gha-${{ github.run_id }}"
          echo "Opening $URL in $pkg on $model API $version"
          set +e
          gcloud firebase test android run --type instrumentation \
            --app android-device-test/app/build/outputs/apk/debug/app-debug.apk \
            --test android-device-test/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            "${extra[@]}" \
            --device "model=$model,version=$version,locale=en,orientation=portrait" \
            --timeout 45m --no-record-video \
            --environment-variables "^;^url=$URL;browser=$pkg" \
            --results-bucket="$BUCKET" --results-dir="$dir"
          status=$?
          set -e
          gcloud storage cp -r "gs://$BUCKET/$dir/" results/ || true
          echo "## Page log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rh "EG2TEST" results --include=logcat | sed 's/.*EG2TEST *: //' | tail -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testlab-results
          path: results/
          if-no-files-found: ignore
